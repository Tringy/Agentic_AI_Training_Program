version: '3.8'

services:
  backend:
    build: ./python
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: google
      DATABASE_PATH: /data
      MEMORY_MAX_ENTRIES: "20"
      MEMORY_TOP_K: "3"
      APPROVAL_TIMEOUT_SECONDS: "3600"
    env_file:
      - ./python/.env
    volumes:
      - ./python:/app
      - db_data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
