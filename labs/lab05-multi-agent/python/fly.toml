app = "tringo-ai-lab05-multi-agent-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LLM_PROVIDER = "google"
  DATABASE_PATH = "/data"
  MAX_PARALLEL_WORKERS = "4"
  APPROVAL_TIMEOUT_SECONDS = "3600"
  RATE_LIMIT_REQUESTS = "60"
  RATE_LIMIT_WINDOW = "60"

[[mounts]]
  source      = "multi_agent_volume"
  destination = "/data"

[[services]]
  internal_port = 8000
  processes = ["app"]
  protocol = "tcp"
  auto_start_machines = false

[http_service]
  internal_port = 8000
  auto_start_machines = false

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "10s"
  type = "http"

[checks.http_service]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "10s"
  type = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
